name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 재배포 (npm run content:publish 가 사진·메시지를 올린 뒤 이걸로 다시 배포)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 비공개 콘텐츠 저장소(사진·메시지)를 읽는 배포 키가 있는지. 키 내용은 노출하지 않고 'true'/'false' 만 쓴다.
      HAS_CONTENT_KEY: ${{ secrets.CONTENT_DEPLOY_KEY != '' }}
      # 생일 종료 후 잠금 사이트를 빌드할 비밀값이 준비됐는지(값 자체는 잠금 빌드 단계에만 전달).
      HAS_LOCK_SECRETS: ${{ secrets.SITE_CONTENT_KEY != '' && (secrets.SITE_PASSWORD != '' || secrets.SITE_LOCK_CODE != '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      # 공개 저장소에 허용 목록 밖 이미지가 들어 있으면 여기서 실패(훅을 --no-verify 로 건너뛴 커밋도 잡음).
      - name: Check no private photos in public repo
        run: node scripts/check-no-photos.mjs --tracked

      # 공개 시각(2026-11-23 19:30 KST) 전에는 사진·메시지를 가져오지 않고 더미로 빌드한다.
      # 19:30 에 scheduled-release.yml 이 이 배포를 다시 실행하면 그때부터 실제 사진·메시지가 실린다.
      - name: Check content release time
        id: release
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d 2026-11-23T10:30:00Z +%s)" ]; then echo "open=true" >> "$GITHUB_OUTPUT"
          else echo "open=false" >> "$GITHUB_OUTPUT"; echo "::notice title=공개 전::19:30 KST 전이라 더미 사진·메시지로 빌드합니다."; fi

      # 생일이 끝난 뒤(2026-11-24 00:00 KST):
      # - 비공개 콘텐츠 키(CONTENT_DEPLOY_KEY)와 잠금 비밀값(SITE_CONTENT_KEY + SITE_PASSWORD 또는 SITE_LOCK_CODE)이 모두 있으면
      #   암호화된 잠금 사이트로 빌드한다.
      # - 하나라도 없으면 기존처럼 '끝났어요' 안내 페이지만 배포한다.
      - name: Check birthday ended
        id: ended
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d 2026-11-23T15:00:00Z +%s)" ]; then
            echo "ended=true" >> "$GITHUB_OUTPUT"
            if [ "$HAS_CONTENT_KEY" = "true" ] && [ "$HAS_LOCK_SECRETS" = "true" ]; then
              echo "locked=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=생일 종료(잠금 모드)::암호화된 잠금 사이트로 빌드합니다."
            else
              echo "locked=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=생일 종료::안내 페이지만 배포합니다."
            fi
          else
            echo "ended=false" >> "$GITHUB_OUTPUT"
            echo "locked=false" >> "$GITHUB_OUTPUT"
          fi
      # 사진·메시지 가져오기. 분기:
      #  - 키 없음  → 이 단계 건너뜀 + 경고, 더미 사진·메시지로 빌드(배포는 계속).
      #  - 키 있음  → 가져오기. 실패하면 job 실패 → 배포 안 함(이미 올라가 있는 사이트가 더미로 덮이지 않게).
      # known_hosts 는 actions/checkout 이 GitHub 호스트 키를 내장해 처리. persist-credentials: false 로 키를 남기지 않음.
      - name: Fetch private content (photos, messages)
        if: env.HAS_CONTENT_KEY == 'true' && steps.release.outputs.open == 'true' && (steps.ended.outputs.ended != 'true' || steps.ended.outputs.locked == 'true')
        uses: actions/checkout@v4
        with:
          repository: Deopoler/birthday-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content
          persist-credentials: false
      - name: Warn when content key is missing
        if: env.HAS_CONTENT_KEY != 'true'
        run: echo "::warning title=사진·메시지 없이 배포::CONTENT_DEPLOY_KEY secret 이 없어 비공개 저장소를 가져오지 않고 더미 사진·메시지로 빌드합니다."

      - name: Build ended page
        if: steps.ended.outputs.ended == 'true' && steps.ended.outputs.locked != 'true'
        run: |
          rm -rf content dist && mkdir dist
          cp scripts/ended/index.html public/favicon.svg public/apple-touch-icon.png public/og-image.jpg dist/

      - if: steps.ended.outputs.ended != 'true' || steps.ended.outputs.locked == 'true'
        run: npm ci
      - if: steps.ended.outputs.ended != 'true'
        run: npm run build
      - name: Build locked site
        if: steps.ended.outputs.locked == 'true'
        env:
          SITE_LOCK: '1'
          SITE_CONTENT_KEY: ${{ secrets.SITE_CONTENT_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_LOCK_CODE: ${{ secrets.SITE_LOCK_CODE }}
        run: npm run build

      # dist 에는 처리된 결과만 있어야 한다(원본·.git·messages.json 이 섞이면 실패).
      # 잠금 모드에서는 허용된 공개 배경(sky-night/tree-night) 외의 *.webp 와 모든 *.map 이 하나라도 있으면 실패한다.
      - name: Verify dist has no private originals
        run: |
          bad=$(find dist \( -name .git -o -name 'messages.json' -o -path 'dist/content*' -o -path 'dist/photos*' \) -print)
          if [ -n "$bad" ]; then echo "::error::dist 에 들어가면 안 되는 파일: $bad"; exit 1; fi
          if [ "${{ steps.ended.outputs.locked }}" = "true" ]; then
            bad_locked=$(find dist \( -name '*.map' -o \( -name '*.webp' ! -name 'sky-night-*.webp' ! -name 'tree-night-*.webp' \) \) -print)
            if [ -n "$bad_locked" ]; then
              echo "::error::잠금 빌드인데 허용되지 않은 WebP 또는 소스맵이 dist에 남아 있습니다: $bad_locked"
              exit 1
            fi
            bin_count=$(find dist -name 'c-*.bin' | wc -l)
            echo "locked dist: 0 private webp/map files, $bin_count encrypted .bin assets"
          else
            echo "photos in dist: $(find dist -name 'photo-*.webp' | wc -l) webp files"
          fi

      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
