name: Scheduled content release
# 2026-11-23 19:30 KST(10:30 UTC)에 배포(deploy.yml)를 한 번 다시 실행해서, 비공개 저장소에 미리 올려 둔 사진·메시지를 사이트에 싣는다.
# GitHub 예약 실행은 늦게 시작될 수 있어 18:50·19:10 KST 에 두 번 깨우고, 19:30 까지 기다렸다가 배포를 시작한다.
# 19:29 KST 이후 이미 수동 배포가 시작됐으면 다시 하지 않는다. 수동 실행(workflow_dispatch)은 기다리지 않고 바로 배포한다.
on:
  schedule:
    - cron: '50 9 23 11 *'
    - cron: '10 10 23 11 *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: scheduled-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_UTC: '2026-11-23T10:30:00Z'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check date
        id: check
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(TZ=Asia/Seoul date +%F)" != 2026-11-23 ]; then
            echo "Not the release day; skip."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Wait until release time
        if: steps.check.outputs.go == 'true' && github.event_name == 'schedule'
        run: |
          now=$(date -u +%s); target=$(date -u -d "$TARGET_UTC" +%s)
          if [ "$now" -lt "$target" ]; then echo "Sleeping $((target - now))s"; sleep $((target - now)); fi

      - name: Start deploy
        if: steps.check.outputs.go == 'true'
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            done=$(gh run list --workflow deploy.yml --event workflow_dispatch --created ">=2026-11-23T10:29:00Z" --json databaseId --jq length)
            if [ "${done:-0}" -gt 0 ]; then echo "Deploy already started after release time; skip."; exit 0; fi
          fi
          # GITHUB_TOKEN 으로는 push 트리거가 깨지 않지만 workflow_dispatch 는 실행된다.
          gh workflow run deploy.yml --ref main
          echo "Deploy started."
