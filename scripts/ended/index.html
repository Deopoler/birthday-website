<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>하진 순장님 생일 축하</title>
    <meta name="description" content="하진 순장님의 생일 축하가 끝났어요. 함께 축하해 주셔서 고마워요 ✨" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="하진 순장님 생일 축하" />
    <meta property="og:title" content="하진 순장님 생일 축하" />
    <meta property="og:description" content="하진 순장님의 생일 축하가 끝났어요. 함께 축하해 주셔서 고마워요 ✨" />
    <meta property="og:url" content="https://deopoler.github.io/birthday-website/" />
    <meta property="og:image" content="https://deopoler.github.io/birthday-website/og-image.jpg?v=3" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: grid; place-items: center; padding: 24px 16px;
        background: radial-gradient(ellipse 80% 60% at 50% 30%, #1a2350 0%, #0a0f2c 55%, #04061a 100%);
        color: #fff6e0; font-family: 'Gowun Batang', serif; text-align: center;
      }
      main { max-width: 420px; }
      .moon { font-size: 44px; margin-bottom: 20px; }
      h1 { font-size: 22px; font-weight: 700; line-height: 1.6; letter-spacing: 0.02em; }
      p { margin-top: 14px; font-size: 16px; line-height: 1.8; color: #d9dcef; }
      .stars { position: fixed; inset: 0; pointer-events: none; z-index: -1;
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 78% 12%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 64% 34%, #ffe9b8 50%, transparent 51%),
          radial-gradient(1px 1px at 30% 70%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 88% 62%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 20% 44%, #ffe9b8 50%, transparent 51%),
          radial-gradient(1px 1px at 52% 86%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 42% 8%, #fff 50%, transparent 51%);
        opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main>
      <div class="moon" aria-hidden="true">🌙</div>
      <h1>하진 순장님의 생일 축하가<br />끝났어요</h1>
      <p>함께 축하해 주셔서 고마워요 ✨<br />이제 이 페이지는 하진 순장님만 볼 수 있어요.</p>
    </main>
  </body>
</html>
